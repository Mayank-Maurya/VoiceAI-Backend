services:
  stt-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: voiceai-stt:local
    ports:
      - "7001:7001"
    environment:
      MODEL_NAME: nvidia/canary-qwen-2.5b
      MAX_NEW_TOKENS: "128"
      HF_HOME: /models/huggingface
      TRANSFORMERS_CACHE: /models/huggingface
      NEMO_CACHE_DIR: /models/nemo
    volumes:
      - voiceai-stt-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  voiceai-stt-models: