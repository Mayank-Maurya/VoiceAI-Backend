# GPU-PC processing services: vLLM (:8000), STT (:7003), TTS (:7002).
#
#   docker compose up --build -d     # build + start everything
#   docker compose logs -f stt       # follow one service's logs
#   docker compose ps                # status / health
#   docker compose down              # stop everything
#
# Run the Node orchestrator separately (on your Mac / LAN) with REMOTE_IP set to
# this machine's IP. Requires the NVIDIA Container Toolkit on the host.

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

# Compose's user-defined network can't always reach the host's DNS resolver,
# which breaks model downloads from huggingface.co. Pin a public resolver.
# Swap for your router/internal DNS if 8.8.8.8 is blocked on your network.
x-dns: &dns
  - 8.8.8.8
  - 1.1.1.1

services:
  vllm:
    image: vllm/vllm-openai:latest
    <<: *gpu
    dns: *dns
    ipc: host
    ports:
      - "8000:8000"
    volumes:
      # Reuse the host's HF cache so the model isn't re-downloaded.
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    command:
      # Phase 4: 3B model for genuinely contextual replies. ~6GB bf16 weights;
      # util 0.65 (~7.8GB) leaves room for STT (~0.8GB) + TTS (~0.2GB) on a 12GB
      # card. If it OOMs, lower util or use Qwen/Qwen2.5-3B-Instruct-AWQ (int4).
      - Qwen/Qwen2.5-3B-Instruct
      - --host=0.0.0.0
      - --port=8000
      - --gpu-memory-utilization=0.65
      - --max-model-len=4096
      - --max-num-seqs=16
    restart: unless-stopped

  stt:
    build: .
    image: voiceai-processing:latest
    <<: *gpu
    dns: *dns
    ports:
      - "7003:7003"
    environment:
      - HF_HOME=/models/huggingface
      - STT_NUM_WORKERS=4
      - TURN_DETECTION=on
      - EMOTION_DETECTION=${EMOTION_DETECTION:-on}
      # Default is 4-class and a bit neutral-heavy. For a stronger clean-loading
      # model, set EMOTION_MODEL in processing-engine/.env, e.g.:
      #   EMOTION_MODEL=superb/hubert-large-superb-er
      # AVOID ehcalabres/wav2vec2-lg-xlsr-...: its custom head loads as RANDOM
      # weights under the standard class (see load report) -> garbage predictions.
      - EMOTION_MODEL=${EMOTION_MODEL:-superb/wav2vec2-base-superb-er}
      - EMOTION_NEUTRAL_OVERRIDE=${EMOTION_NEUTRAL_OVERRIDE:-0.3}
      # - STT_DEVICE=cpu          # fallback if GPU ctranslate2/cuDNN misbehaves
    volumes:
      - hf-cache:/models/huggingface
    command: python stt_service.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7003/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s   # first run downloads whisper + smart-turn models

  tts:
    build: .
    image: voiceai-processing:latest
    <<: *gpu
    dns: *dns
    ports:
      - "7002:7002"
    environment:
      - HF_HOME=/models/huggingface
      # Backend: "kokoro" (local, default), "rumik" or "elevenlabs" (cloud).
      # Set these in a processing-engine/.env file (git-ignored) — do NOT commit
      # API keys. Selecting a cloud provider with its key set switches to it;
      # an unset/absent key falls back to Kokoro automatically.
      - TTS_PROVIDER=${TTS_PROVIDER:-kokoro}
      # rumik.ai Silk (streams PCM16 @ 24kHz):
      - RUMIK_API_KEY=${RUMIK_API_KEY:-}
      - RUMIK_MODEL=${RUMIK_MODEL:-mulberry}
      - RUMIK_SPEAKER=${RUMIK_SPEAKER:-speaker_1}
      - RUMIK_DESCRIPTION=${RUMIK_DESCRIPTION:-}
      # Speak replies with the detected emotion via rumik [tone] tags. Off if
      # rumik voices unrecognized tags literally.
      - RUMIK_EMOTION_TAGS=${RUMIK_EMOTION_TAGS:-on}
      # ElevenLabs:
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-21m00Tcm4TlvDq8ikWAM}
      - ELEVENLABS_MODEL=${ELEVENLABS_MODEL:-eleven_flash_v2_5}
    volumes:
      - hf-cache:/models/huggingface
    command: python tts-service.py
    restart: unless-stopped
    depends_on:
      - stt   # let the shared image build once before tts starts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7002/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s

volumes:
  hf-cache:   # persists downloaded models (whisper, kokoro, smart-turn) across rebuilds
